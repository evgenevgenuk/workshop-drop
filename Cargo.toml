[package]
name = "workshop_drop"
version = "1.1.0"
edition = "2021"
description = "Paste a Steam Workshop link, get the addon installed on your Garry's Mod dedicated server."
license = "MIT"
repository = "https://github.com/evgenevgenuk/workshop-drop"

[[bin]]
name = "WorkshopDrop"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
# native-tls on Windows = system SChannel: no C compiler needed.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lzma-rs = "0.3"
crc32fast = "1"
rfd = "0.15"
chrono = "0.4"
anyhow = "1"
regex = "1"
sysinfo = "0.33"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
strip = true
